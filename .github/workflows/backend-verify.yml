name: Backend security and build gate

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/backend-verify.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/backend-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile backend Python modules
        run: python -m compileall -q backend
      - name: Run security and route regression tests
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          backend/tests/test_api_module_regressions.py
          backend/tests/test_security_and_background_tasks.py
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: sovereign-ai-arsenal-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
