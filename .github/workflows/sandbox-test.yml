name: Sandbox Testing

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/core/docker_runner.py'
      - 'backend/requirements.txt'
      - '.github/workflows/sandbox-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/core/docker_runner.py'
      - 'backend/requirements.txt'
      - '.github/workflows/sandbox-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test_repo:
          - name: "test-repo-simple"
            url: "https://github.com/octocat/Hello-World"
            expected_complexity: "low"
          - name: "test-repo-medium"
            url: "https://github.com/pallets/flask"
            expected_complexity: "medium"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify Docker runtime
        run: |
          set -euo pipefail
          docker version
          docker info

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Test sandbox functionality
        id: test
        run: |
          set -euo pipefail
          cd backend

          cat > test_sandbox.py << 'PYTEST'
          import asyncio
          import json
          import logging
          from datetime import datetime, timezone
          from core.docker_runner import DockerSandboxManager, SandboxResult

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger(__name__)

          async def test_sandbox():
              config = {
                  'sandbox': {
                      'base_image': 'python:3.11-slim',
                      'timeout': 120,
                      'memory_limit': '256m',
                      'cpu_limit': '0.5'
                  }
              }
              manager = DockerSandboxManager(config)
              logger.info("Sandbox manager initialized")
              repo_data = {
                  'id': 'test-123',
                  'name': '${{ matrix.test_repo.name }}',
                  'full_name': '${{ matrix.test_repo.name }}',
                  'clone_url': '${{ matrix.test_repo.url }}',
                  'stargazers_count': 100,
                  'forks_count': 20,
                  'language': 'Python'
              }
              result = await manager.analyze_repository_in_sandbox(repo_data)
              assert isinstance(result, SandboxResult)
              assert result.repository_id == 'test-123'
              assert isinstance(result.clone_success, bool)
              assert isinstance(result.setup_complexity_score, float)
              assert 0 <= result.setup_complexity_score <= 1

              test_results = {
                  'repository': '${{ matrix.test_repo.name }}',
                  'clone_success': result.clone_success,
                  'install_success': result.install_success,
                  'test_success': result.test_success,
                  'setup_complexity_score': result.setup_complexity_score,
                  'execution_time_seconds': result.execution_time_seconds,
                  'dependencies_count': len(result.dependencies),
                  'security_issues_count': len(result.security_issues),
                  'file_structure': result.file_structure,
                  'expected_complexity': '${{ matrix.test_repo.expected_complexity }}',
                  'timestamp': datetime.now(timezone.utc).isoformat()
              }
              with open('/tmp/sandbox_test_results.json', 'w', encoding='utf-8') as f:
                  json.dump(test_results, f, indent=2)
              print(f"SANDBOX_TEST_RESULTS:{json.dumps(test_results)}")
              manager.cleanup()

          asyncio.run(test_sandbox())
          PYTEST

          python test_sandbox.py 2>&1 | tee sandbox_test.log

          RESULTS=$(grep 'SANDBOX_TEST_RESULTS:' sandbox_test.log | sed 's/^.*SANDBOX_TEST_RESULTS://' || true)
          if [ -z "$RESULTS" ]; then
            echo 'No structured sandbox result was produced.' >&2
            exit 1
          fi
          {
            echo 'results<<EOF'
            echo "$RESULTS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate test results
        run: |
          set -euo pipefail
          RESULTS='${{ steps.test.outputs.results }}'
          echo "$RESULTS" | jq '.'
          CLONE_SUCCESS=$(echo "$RESULTS" | jq -r '.clone_success // false')
          COMPLEXITY_SCORE=$(echo "$RESULTS" | jq -r '.setup_complexity_score // -1')
          EXECUTION_TIME=$(echo "$RESULTS" | jq -r '.execution_time_seconds // 0')
          test "$CLONE_SUCCESS" = "true"
          awk -v score="$COMPLEXITY_SCORE" 'BEGIN { exit !(score >= 0 && score <= 1) }'
          echo "Clone success: $CLONE_SUCCESS"
          echo "Complexity score: $COMPLEXITY_SCORE"
          echo "Execution time: $EXECUTION_TIME seconds"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-test-${{ matrix.test_repo.name }}
          path: |
            /tmp/sandbox_test_results.json
            backend/sandbox_test.log
          if-no-files-found: warn
          retention-days: 7

  cleanup:
    runs-on: ubuntu-24.04
    if: always()
    needs: sandbox-test
    permissions: {}
    steps:
      - name: Verify runner availability
        run: |
          set -euo pipefail
          docker version
          echo "Cleanup job reached execution stage successfully."
