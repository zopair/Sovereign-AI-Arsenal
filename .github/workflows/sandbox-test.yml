name: Sandbox Testing

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/core/docker_runner.py'
      - 'backend/requirements.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/core/docker_runner.py'
      - 'backend/requirements.txt'
  workflow_dispatch:

jobs:
  sandbox-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      matrix:
        test_repo:
          - name: "test-repo-simple"
            url: "https://github.com/octocat/Hello-World"
            expected_complexity: "low"
          - name: "test-repo-medium"
            url: "https://github.com/pallets/flask"
            expected_complexity: "medium"
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Docker
      uses: docker/setup-buildx-action@v3

    - name: Install sandbox test dependencies
      run: python -m pip install --disable-pip-version-check aiofiles aiohttp docker

    - name: Test sandbox functionality
      id: test
      run: |
        cd backend
        
        cat > test_sandbox.py << 'EOF'
        import asyncio
        import json
        import logging
        from datetime import datetime
        from core.docker_runner import DockerSandboxManager, SandboxResult
        
        # Configure logging
        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)
        
        async def test_sandbox():
            try:
                # Initialize sandbox manager
                config = {
                    'sandbox': {
                        'base_image': 'python:3.11-slim',
                        'timeout': 120,
                        'memory_limit': '256m',
                        'cpu_limit': '0.5'
                    }
                }
                
                manager = DockerSandboxManager(config)
                logger.info("Sandbox manager initialized")
                
                # Test repository data
                repo_data = {
                    'id': 'test-123',
                    'name': '${{ matrix.test_repo.name }}',
                    'full_name': '${{ matrix.test_repo.name }}',
                    'clone_url': '${{ matrix.test_repo.url }}',
                    'stargazers_count': 100,
                    'forks_count': 20,
                    'language': 'Python'
                }
                
                # Run sandbox analysis
                logger.info(f"Testing sandbox with repository: ${{ matrix.test_repo.name }}")
                result = await manager.analyze_repository_in_sandbox(repo_data)
                
                # Validate results
                assert isinstance(result, SandboxResult), "Result should be SandboxResult instance"
                assert result.repository_id == 'test-123', "Repository ID should match"
                assert isinstance(result.clone_success, bool), "Clone success should be boolean"
                assert isinstance(result.setup_complexity_score, float), "Complexity score should be float"
                assert 0 <= result.setup_complexity_score <= 1, "Complexity score should be between 0 and 1"
                
                # Log results
                logger.info(f"Sandbox test completed for ${{ matrix.test_repo.name }}")
                logger.info(f"Clone success: {result.clone_success}")
                logger.info(f"Install success: {result.install_success}")
                logger.info(f"Test success: {result.test_success}")
                logger.info(f"Setup complexity score: {result.setup_complexity_score}")
                logger.info(f"Execution time: {result.execution_time_seconds:.2f}s")
                logger.info(f"Dependencies found: {len(result.dependencies)}")
                logger.info(f"Security issues: {len(result.security_issues)}")
                logger.info(f"Error logs: {result.error_logs}")
                logger.info(f"Test output: {result.test_output}")
                
                # Save test results
                test_results = {
                    'repository': '${{ matrix.test_repo.name }}',
                    'clone_success': result.clone_success,
                    'install_success': result.install_success,
                    'test_success': result.test_success,
                    'setup_complexity_score': result.setup_complexity_score,
                    'execution_time_seconds': result.execution_time_seconds,
                    'dependencies_count': len(result.dependencies),
                    'security_issues_count': len(result.security_issues),
                    'error_logs': result.error_logs,
                    'test_output': result.test_output,
                    'file_structure': result.file_structure,
                    'expected_complexity': '${{ matrix.test_repo.expected_complexity }}',
                    'timestamp': datetime.utcnow().isoformat()
                }
                
                with open('/tmp/sandbox_test_results.json', 'w') as f:
                    json.dump(test_results, f, indent=2)
                
                print(f"SANDBOX_TEST_RESULTS:{json.dumps(test_results)}")
                
                # Cleanup
                manager.cleanup()
                
                return test_results
                
            except Exception as e:
                logger.error(f"Sandbox test failed: {e}")
                print(f"SANDBOX_TEST_ERROR:{str(e)}")
                raise
        
        if __name__ == "__main__":
            asyncio.run(test_sandbox())
        EOF
        
        # Preserve the Python test exit code through tee.
        set -o pipefail
        python test_sandbox.py 2>&1 | tee sandbox_test.log
        
    - name: Validate test results
      run: |
        if [ ! -s /tmp/sandbox_test_results.json ]; then
          echo "No test results found"
          exit 1
        fi

        RESULTS="$(cat /tmp/sandbox_test_results.json)"
        echo "Test results:"
        printf '%s\n' "$RESULTS" | jq '.'

        CLONE_SUCCESS=$(printf '%s\n' "$RESULTS" | jq -r '.clone_success // false')
        INSTALL_SUCCESS=$(printf '%s\n' "$RESULTS" | jq -r '.install_success // false')
        TEST_SUCCESS=$(printf '%s\n' "$RESULTS" | jq -r '.test_success // false')
        COMPLEXITY_SCORE=$(printf '%s\n' "$RESULTS" | jq -r '.setup_complexity_score // 0')
        EXECUTION_TIME=$(printf '%s\n' "$RESULTS" | jq -r '.execution_time_seconds // 0')

        echo "Clone success: $CLONE_SUCCESS"
        echo "Install success: $INSTALL_SUCCESS"
        echo "Test success: $TEST_SUCCESS"
        echo "Complexity score: $COMPLEXITY_SCORE"
        echo "Execution time: $EXECUTION_TIME seconds"

        if [ "$CLONE_SUCCESS" = "false" ]; then
          echo "Clone failed for ${{ matrix.test_repo.name }}"
          exit 1
        fi
        if [ "$INSTALL_SUCCESS" = "false" ]; then
          echo "Dependency installation failed for ${{ matrix.test_repo.name }}"
          exit 1
        fi
        if [ "$TEST_SUCCESS" = "false" ]; then
          echo "Tests failed for ${{ matrix.test_repo.name }}"
          exit 1
        fi
        if (( $(echo "$COMPLEXITY_SCORE < 0" | bc -l) )); then
          echo "Invalid complexity score: $COMPLEXITY_SCORE"
          exit 1
        fi
        if (( $(echo "$EXECUTION_TIME > 180" | bc -l) )); then
          echo "Long execution time: $EXECUTION_TIME seconds"
        fi
        echo "Sandbox test passed for ${{ matrix.test_repo.name }}"

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sandbox-test-${{ matrix.test_repo.name }}
        path: |
          /tmp/sandbox_test_results.json
          backend/sandbox_test.log
        retention-days: 7

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: sandbox-test
    
    steps:
    - name: Cleanup Docker resources
      run: |
        docker system prune -af
        docker volume prune -f
        docker network prune -f