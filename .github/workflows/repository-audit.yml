name: Scheduled Repository Audit

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run dependency-free factory tests
        run: python -m unittest discover -s factory -p "test_*.py" -v

      - name: Inspect configured repositories
        run: python -m factory.batch --targets factory/repository_targets.json --output reports/repository-audit.json

      - name: Upload inventory report
        if: always() && hashFiles('reports/repository-audit.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-audit-${{ github.run_number }}
          path: reports/repository-audit.json
          if-no-files-found: error
          retention-days: 14
